<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section class="containerSuperior">
        <div class="title">
            <h3 class="minimal">Minimal</h3>
            <h1 class="titleToDoList">To Do List</h1>
        </div>
        
        <img class="icon primero" src="image/accelerate-svgrepo-com.svg" alt="Cohete" srcset="">
        <img class="icon segundo" src="image/set-up-svgrepo-com.svg" alt="Configuración" srcset="">
        <img class="icon tercero" src="image/thumbs-up-svgrepo-com.svg" alt="Limpieza" srcset="">
    </section>

    <div class="buttonthree">
        <button class="btn btnAll" type="button" >All</button>
        <button class="btn btnPending" type="button" >Pending</button>
        <button class="btn btnCompleted" type="button" >Completed</button>
    </div>

    <br>
    <div class="containerInferior">
        <div class="inputToDoList">
            <input class="inputAdd" type="text" placeholder="Add a new task">
            <button class="buttonAdd" type="submit">Add</button>
        </div>



        
       

        
    </div>
    

    <script type="module" src="scripts/scripts.js"></script>
</body>
</html>
